<!DOCTYPE html>
<!--
  Start page for the website address.
  Web hosts (like GitHub Pages) open index.html when someone visits the
  bare address, e.g. https://you.github.io/calc/ — this page just sends
  them straight on to the calculator.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Jump to the calculator immediately (0 seconds). -->
  <meta http-equiv="refresh" content="0; url=calc.htm">
  <!-- Lets the APK builder find the app details from this page too. -->
  <link rel="manifest" href="manifest.json">
  <title>Calculator</title>
</head>
<body>
  <!-- Shown only if the automatic jump is blocked. -->
  <a href="calc.htm">Open the calculator</a>
</body>
</html>
